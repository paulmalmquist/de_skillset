# Example policy. Map actual project.dataset.relation patterns before production use.
version: '1'
dialect: bigquery
relation_layers:
  '*.raw.*': source
  '*.staging.*': staging
  '*.intermediate.*': intermediate
  '*.mart.*': mart
  '*.serving.*': serving
  raw.*: source
  staging.*: staging
  intermediate.*: intermediate
  mart.*: mart
  serving.*: serving
allowed_dependencies:
  source: []
  staging:
  - source
  intermediate:
  - staging
  - intermediate
  mart:
  - staging
  - intermediate
  - mart
  serving:
  - mart
  - serving
  consumer:
  - mart
  - serving
max_freshness_hours: 24.0
max_evidence_age_hours: 4.0
exceptions: []
# Exact registrations are required for standalone published consumers. Configure privately;
# see docs/CANDIDATE-CI.md. Layer naming patterns are not publication approvals.
published_contracts: {}
